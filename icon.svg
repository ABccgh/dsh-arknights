<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Arknights stage runner">
  <defs>
    <linearGradient id="arkbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="arklight" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4cc2ff"/>
      <stop offset="1" stop-color="#a6f0ff"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#arkbg)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="13.25" fill="none" stroke="#2f4a76" stroke-width="1.5"/>
  <!-- three advancing chevrons: push forward -->
  <path d="M15 20 L27 32 L15 44" fill="none" stroke="url(#arklight)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  <path d="M25 20 L37 32 L25 44" fill="none" stroke="url(#arklight)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <path d="M35 20 L47 32 L35 44" fill="none" stroke="url(#arklight)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- target star for a full-star clear -->
  <path d="M48 12 L49.9 16.2 L54.5 16.7 L51.1 19.8 L52.1 24.3 L48 22 L43.9 24.3 L44.9 19.8 L41.5 16.7 L46.1 16.2 Z" fill="#ffe27a"/>
</svg>
